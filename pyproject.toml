[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acl-hct"
version = "0.1.0"
description = "Auditable initial diagnostics for sampled Lorentz aggregation"
requires-python = ">=3.10"
dependencies = ["torch>=2.0", "numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7"]
plots = ["matplotlib>=3.6"]
benchmark = ["scikit-learn>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
